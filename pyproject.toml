[project]
name = "bbva-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Jimenez", email = "sergio.a.jimenez@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "scrapy>=2.19.0",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bbva-rag = "bbva_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ISC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
