name: bbva-rag

# Configuración compartida de los servicios de la aplicación (definida aquí, reutilizada más adelante con <<: *app)
x-app: &app
  image: bbva-rag-app:latest
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  volumes:
    - models_cache:/app/.cache

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: bbva-rag-qdrant
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: bbva-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingest:
    <<: *app
    build: .
    container_name: bbva-rag-ingest
    command: ["python", "-m", "bbva_rag.ingestion.run", "--if-empty", "--download-models"]
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"

  api:
    <<: *app
    pull_policy: never
    container_name: bbva-rag-api
    command: ["uvicorn", "bbva_rag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  ui:
    <<: *app
    pull_policy: never
    container_name: bbva-rag-ui
    command: ["streamlit", "run", "src/bbva_rag/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      API_BASE_URL: http://api:8000
    ports:
      - "${UI_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  models_cache: